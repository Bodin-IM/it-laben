name: Backend og nettsted
on:
  push:
    branches: [backend, main, dev]
  pull_request:
    branches: [main, backend, dev]
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: shellcheck server/deploy/*.sh
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke
          path: test-results/browser-smoke/
          if-no-files-found: ignore
          retention-days: 7
